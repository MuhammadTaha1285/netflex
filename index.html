<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMagnet Pro</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./welcome.html">
    </div>
</head>
<script>
    if (!sessionStorage.getItem("welcomeShown")) {
        sessionStorage.setItem("welcomeShown", "true");
        window.location.href = "welcome.html";
    }
</script>

<body class="bg-[#0b0f1a] text-slate-200 overflow-hidden" id="bodyTag">

    <div id="searchOverlay"
        class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-10">
        <button onclick="toggleSearch()"
            class="absolute top-10 right-10 text-white text-3xl hover:text-rose-600 transition">
            <i class="fas fa-times"></i>
        </button>
        <div class="w-full max-w-4xl relative">
            <input type="text" id="searchInput" placeholder="Type to search movies..."
                class="w-full bg-transparent border-b-4 border-slate-700 py-6 text-4xl font-bold outline-none focus:border-rose-600 transition-all text-white placeholder-slate-600">
            <p class="text-slate-500 mt-4 font-semibold uppercase tracking-widest text-sm">Press Escape to close</p>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">

        <aside id="sidebar"
            class="w-24 border-r border-slate-800 flex flex-col p-4 bg-[#0b0f1a] z-50 transition-all duration-500">
            <div class="mb-12 flex justify-center group relative cursor-pointer">
                <div
                    class="w-14 h-14 bg-rose-600 rounded-2xl flex items-center justify-center shadow-lg group-hover:rotate-[360deg] group-hover:scale-110 group-hover:shadow-rose-600/50 transition-all duration-700">
                    <i class="fas fa-magnet text-white text-2xl"></i>
                </div>
                <span
                    class="absolute left-20 bg-rose-600 text-white text-xs font-bold px-3 py-2 rounded-lg opacity-0 group-hover:opacity-100 transition-all translate-x-2 group-hover:translate-x-0 whitespace-nowrap">MovieMagnet
                    Pro</span>
            </div>

            <nav class="flex-1 space-y-6 flex flex-col items-center">
                <button onclick="toggleSearch()"
                    class="sidebar-icon-btn group relative p-4 rounded-2xl text-slate-400 hover:bg-rose-600 hover:text-white transition-all">
                    <i class="fas fa-search text-xl"></i>
                    <span class="sidebar-tooltip">Search</span>
                </button>
                <button onclick="changeCategory('/movie/popular', 'Trending', this)"
                    class="sidebar-icon-btn active group relative p-4 rounded-2xl text-slate-400 hover:bg-rose-600 hover:text-white transition-all">
                    <i class="fas fa-fire text-xl"></i>
                    <span class="sidebar-tooltip">Trending</span>
                </button>
                <button onclick="changeCategory('/tv/popular', 'TV Shows', this)"
                    class="sidebar-icon-btn group relative p-4 rounded-2xl text-slate-400 hover:bg-rose-600 hover:text-white transition-all">
                    <i class="fas fa-desktop text-xl"></i>
                    <span class="sidebar-tooltip">TV Shows</span>
                </button>
                <button onclick="showFavorites()"
                    class="sidebar-icon-btn group relative p-4 rounded-2xl text-slate-400 hover:bg-rose-600 hover:text-white transition-all">
                    <i class="fas fa-heart text-xl"></i>
                    <span class="sidebar-tooltip">Favorites</span>
                </button>
                <button onclick="showWatchlist()"
                    class="sidebar-icon-btn group relative p-4 rounded-2xl text-slate-400 hover:bg-rose-600 hover:text-white transition-all">
                    <i class="fas fa-bookmark text-xl"></i>
                    <span class="sidebar-tooltip">Watchlist</span>
                </button>
            </nav>

            <button id="themeToggle"
                class="w-14 h-14 bg-slate-800/50 rounded-2xl hover:bg-rose-600 hover:text-white transition-all flex items-center justify-center group relative mx-auto">
                <i class="fas fa-moon" id="themeIcon"></i>
                <span class="sidebar-tooltip">Theme</span>
            </button>
        </aside>

        <main class="flex-1 flex flex-col overflow-y-auto bg-[#0b0f1a]" id="mainScroll">

            <header class="p-6 sticky top-0 bg-[#0b0f1a]/80 backdrop-blur-xl z-40 border-b border-slate-800/50">
                <div class="flex items-center justify-between mb-6">
                    <h2 id="sectionTitle" class="text-3xl font-extrabold tracking-tight">Trending Now</h2>
                    <a href="signin.html"
                        class="bg-rose-600 hover:bg-rose-700 px-6 py-3 rounded-xl font-bold transition-all shadow-lg flex items-center group">
                        <i class="fas fa-user mr-2 group-hover:scale-125 transition"></i> Sign In
                    </a>
                </div>

                <div class="flex gap-3 overflow-x-auto pb-2 no-scrollbar" id="genreContainer">
                    <button onclick="filterByGenre(28, 'Action', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Action</button>
                    <button onclick="filterByGenre(35, 'Comedy', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Comedy</button>
                    <button onclick="filterByGenre(27, 'Horror', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Horror</button>
                    <button onclick="filterByGenre(878, 'Sci-Fi', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Sci-Fi</button>
                    <button onclick="filterByGenre(10749, 'Romance', this)"
                        class="genre-btn px-6 py-2 rounded-full border border-slate-700 text-sm font-semibold hover:border-rose-600 transition whitespace-nowrap">Romance</button>
                </div>
            </header>

            <div class="p-8">
                <div id="loading"
                    class="hidden mb-4 loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-8 w-8 mx-auto">
                </div>

                <div id="movieGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-6">
                </div>

                <div class="flex justify-center py-16">
                    <button id="loadMore"
                        class="group bg-slate-800 hover:bg-rose-600 text-white font-bold py-4 px-12 rounded-2xl transition-all shadow-xl flex items-center gap-3">
                        <span>Load More Content</span>
                        <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform"></i>
                    </button>
                </div>
            </div>
            <footer class="mt-auto border-t border-slate-800 p-8 text-center text-slate-500 text-sm">
                <p>© 2026 MovieMagnet Pro. All rights reserved.</p>
            </footer>
        </main>
    </div>

    <div id="trailerModal" class="fixed inset-0 z-[100] hidden bg-black/95 flex items-center justify-center p-4">
        <div
            class="relative w-full max-w-6xl bg-[#0f172a] rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row h-[90vh] md:h-auto">
            <button onclick="closeTrailer()"
                class="absolute top-4 right-4 z-[120] bg-rose-600 text-white w-10 h-10 rounded-full flex items-center justify-center hover:scale-110 transition shadow-lg">
                <i class="fas fa-times text-xl"></i>
            </button>
            <div class="w-full md:w-2/3 bg-black flex items-center justify-center aspect-video md:aspect-auto">
                <div id="videoContainer" class="w-full h-full"></div>
            </div>
            <div id="infoPanel" class="w-full md:w-1/3 p-8 overflow-y-auto bg-slate-900/50 backdrop-blur-md text-white">
                <h2 id="modalTitle" class="text-3xl font-bold mb-2">Movie Title</h2>
                <div class="flex items-center gap-3 mb-6">
                    <span id="modalRating"
                        class="bg-rose-600 text-white text-xs font-bold px-2 py-1 rounded">Rating</span>
                    <span id="modalDate" class="text-slate-400 text-sm">Year</span>
                </div>
                <h4 class="text-rose-500 font-bold uppercase text-xs tracking-widest mb-2">Storyline</h4>
                <p id="modalDesc" class="text-slate-300 text-sm leading-relaxed mb-8">Overview...</p>
                <div id="modalLinks"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>

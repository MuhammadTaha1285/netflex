<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Magnet Pro</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: black;
            color: white;
        }

        /* BACKGROUND VIDEO */

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
        }

        /* DARK OVERLAY */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: -2;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 90px;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            z-index: 100;
        }

        .logo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff0055, #ff4d88);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            font-weight: 700;
            box-shadow: 0 0 25px #ff0055;
            cursor: pointer;
            transition: 0.4s;
        }

        .logo:hover {
            transform: scale(1.1) rotate(10deg);
        }

        .theme-btn {
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 22px;
            transition: 0.4s;
        }

        .theme-btn:hover {
            background: #ff0055;
            transform: translateY(-5px);
        }

        /* MAIN */

        .main {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 60px 60px 60px 140px;
            position: relative;
            z-index: 2;
        }

        /* LEFT SIDE */

        .left {
            width: 48%;
        }

        .left h3 {
            /* font-size: 38px; */
            margin-bottom: 15px;
        }

        .left h1 {
            font-size: 95px;
            line-height: 105px;
            /* margin-bottom:20px; */
            font-weight: 800;
        }



        .left p {
            font-size: 22px;
            line-height: 38px;
            color: #d1d5db;
            max-width: 650px;
            margin-bottom: 40px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            width: 260px;
            padding: 22px 28px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 22px;
            transition: 0.4s;
            font-weight: 600;
        }

        .signin-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .signin-btn:hover {
            background: #ffffff;
            color: #111;
            transform: scale(1.05);
        }

        .trend-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .trend-btn:hover {
            background: #ffffff;
            color: #111;
            transform: scale(1.05);
        }

        /* RIGHT SIDE */

        .right {
            width: 45%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            height: 250px;
            border-radius: 28px;
            overflow: hidden;
            position: relative;
            transition: 0.5s;
            cursor: pointer;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top,
                    rgba(0, 0, 0, 0.55),
                    transparent);
        }

        /* BOTTOM BOX */

        .bottom {
            position: absolute;
            bottom: 20px;
            left: 140px;
            width: calc(100% - 180px);
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 25px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 2;
        }

        .box {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .box i {
            font-size: 34px;
            color: #ff0055;
        }

        .box h4 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        .box p {
            color: #d1d5db;
            line-height: 26px;
        }

        /* RESPONSIVE */

        @media(max-width:1100px) {

            body {
                overflow: auto;
            }

            .main {
                flex-direction: column;
                gap: 50px;
            }

            .left,
            .right {
                width: 100%;
            }

            .bottom {
                position: relative;
                left: 110px;
                width: calc(100% - 130px);
                margin-top: 40px;
                grid-template-columns: 1fr 1fr;
            }

        }

        @media(max-width:700px) {

            .left h1 {
                font-size: 60px;
                line-height: 70px;
            }

            .left p {
                font-size: 18px;
                line-height: 30px;
            }

            .right {
                grid-template-columns: 1fr;
            }

            .bottom {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
            }

        }
    </style>

</head>

<body>

        <!-- RIGHT -->

            <div class="card">

            <div class="card">

    </div>

    <!-- JAVASCRIPT -->

    <script>

        const themeBtn = document.querySelector(".theme-btn");
        const overlay = document.querySelector(".overlay");

        let dark = true;

        themeBtn.addEventListener("click", () => {

            if (dark) {

                overlay.style.background =
                    "rgba(255,255,255,0.45)";

                document.body.style.color = "#111";

                themeBtn.innerHTML =
                    `<i class="fa-solid fa-sun"></i>`;

                dark = false;

            } else {

                overlay.style.background =
                    "rgba(0,0,0,0.72)";

                document.body.style.color = "#fff";

                themeBtn.innerHTML =
                    `<i class="fa-solid fa-moon"></i>`;

                dark = true;

            }


        });

    </script>

</body>
